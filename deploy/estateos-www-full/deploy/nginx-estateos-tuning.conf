# /etc/nginx/conf.d/estateos-tuning.conf
# Keepalive do Next + gzip typów API/JS. Map dla WebSocket bez zabijania keepalive.

upstream estateos_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    image/svg+xml;
