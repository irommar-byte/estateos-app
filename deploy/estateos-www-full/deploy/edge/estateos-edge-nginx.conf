limit_req_zone $binary_remote_addr zone=edge_api:10m rate=30r/s;

upstream estateos_origin {
    server 192.168.50.128:80;
    keepalive 32;
}

upstream lineage_origin {
    server 192.168.50.200:80;
    keepalive 16;
}

upstream lineage_movies_proxy {
    server 192.168.50.200:4322;
    keepalive 16;
}

upstream lineage_movies_ui {
    server 192.168.50.200:4321;
    keepalive 16;
}

map $http_upgrade $edge_connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name estateos.pl www.estateos.pl lineage.mycloudnas.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name estateos.pl www.estateos.pl;

    ssl_certificate /etc/letsencrypt/live/estateos.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estateos.pl/privkey.pem;

    location / {
        limit_req zone=edge_api burst=60 nodelay;
        proxy_pass http://estateos_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $edge_connection_upgrade;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lineage.mycloudnas.com;

    ssl_certificate /etc/letsencrypt/live/lineage.mycloudnas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lineage.mycloudnas.com/privkey.pem;

    location ^~ /admin_pro/api/movies/proxy/ {
        proxy_pass http://lineage_movies_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location ^~ /admin_pro/movies/ {
        proxy_pass http://lineage_movies_ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://lineage_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
}
