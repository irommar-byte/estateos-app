server {
    listen 80;
    server_name lineage.mycloudnas.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_proxied any;
    gzip_vary on;
    server_name lineage.mycloudnas.com;

    ssl_certificate /etc/letsencrypt/live/lineage.mycloudnas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lineage.mycloudnas.com/privkey.pem;

    # Movies UI remains on EstateOS files until the observation window ends.
    # API/proxy traffic already lives on the Lineage VM.
    location = /admin_pro/movies/inject.js {
        alias /home/rommar/lineage-movies/inject.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location ^~ /admin_pro/movies/ {
        alias /home/rommar/lineage-movies/public/;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location ^~ /admin_pro/api/movies/ {
        proxy_pass http://lineage_movies_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 64m;
    }

    location = /panel.php {
        proxy_pass https://192.168.50.200/panel.php;
        proxy_ssl_server_name on;
        proxy_ssl_name lineage.mycloudnas.com;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<script src="/admin_pro/movies/inject.js?v=20260909020000" defer></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    location / {
        proxy_pass http://lineage_origin_http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Upgrade;
    }
}
