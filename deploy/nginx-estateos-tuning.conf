# /etc/nginx/conf.d/estateos-tuning.conf
# Keepalive do Next + gzip typów API/JS. Map dla WebSocket bez zabijania keepalive.

upstream estateos_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

map $uri $estateos_log_uri {
    ~^/api/crm/client-portal/[^/]+/chat$  /api/crm/client-portal/:token/chat;
    ~^/api/crm/client-portal/  /api/crm/client-portal/:token;
    ~^/klient/                 /klient/:token;
    default                    $uri;
}

# Oddzielny, maszynowo czytelny log EstateOS. Nie zapisuje body, cookie,
# Authorization ani parametrów zapytania — $uri celowo zamiast $request_uri.
log_format estateos_timed escape=json
    '{"ts":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"uri":"$estateos_log_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status"}';

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    image/svg+xml;
